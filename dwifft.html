<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151b">
<title>Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151b;--ink:#eef2f6;--mute:#8d99a8;--acc:#ff6a3d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
canvas#c{display:block;width:100%;height:100%}
#hud,#menu{position:absolute;inset:0}

/* HUD */
#hud{pointer-events:none;font-size:clamp(11px,1.7vmin,18px);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.55)}
#hud>div{position:absolute;line-height:1.3}
#tl{left:3.2vmin;top:3.2vmin}
#tr{right:3.2vmin;top:3.2vmin;text-align:right}
#bl{left:3.2vmin;bottom:3.2vmin}
#br{right:3.2vmin;bottom:3.2vmin;text-align:right}
.lbl{display:block;font-size:.7em;font-weight:600;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.val{display:block;font-size:1.45em;font-weight:700;margin-bottom:.5em}
.val.big{font-size:2.6em;font-weight:800;line-height:1;margin-bottom:0}
.unit{font-size:.8em;font-weight:600;letter-spacing:.14em;color:var(--mute);margin-left:.4em}
.mult{font-size:1.1em;font-weight:700;color:var(--acc);margin-left:.4em}
#msg{left:0;right:0;top:24%;text-align:center;font-size:clamp(44px,12vmin,150px);font-weight:800;letter-spacing:.02em;line-height:1.05;display:none}
#msg small{display:block;font-size:.17em;font-weight:600;letter-spacing:.16em;line-height:2.2;color:var(--ink)}
.hl{color:var(--acc)}

/* menu */
#menu{display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;
  background:radial-gradient(120% 90% at 50% 30%,#1d2935 0%,#10151b 72%)}
.menu #menu{display:flex}
.menu #hud{display:none}
h1{font-size:clamp(40px,11vmin,120px);font-weight:800;letter-spacing:.3em;margin-right:-.3em;line-height:1}
h1 i{font-style:normal;color:var(--acc)}
#menu-items{display:flex;flex-direction:column;align-items:center;gap:.5vmin}
.item{font-size:clamp(13px,2.4vmin,26px);font-weight:700;letter-spacing:.16em;color:#6f7b8a;cursor:pointer;
  padding:.45em 1.3em;border-radius:999px;transition:color .15s,background .15s;display:flex;align-items:center;gap:.7em;white-space:nowrap}
.item.sel{color:var(--bg);background:var(--acc)}
.dot{width:.7em;height:.7em;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);flex:none}
#car-preview{width:min(360px,44vmin);aspect-ratio:360/190;display:none}
#menu.sub{gap:1.2vmin}
#menu.sub .hint{display:none}
#menu.sub h1{font-size:clamp(26px,6vmin,64px)}
#menu.sub #car-preview{width:min(300px,34vmin)}
#best{font-size:clamp(10px,1.5vmin,15px);font-weight:600;letter-spacing:.16em;color:var(--acc);min-height:1.3em;text-align:center}
.hint{font-size:clamp(9px,1.3vmin,13px);font-weight:500;letter-spacing:.12em;line-height:2.1;text-align:center;color:var(--mute)}
.hint.hl{color:var(--ink)}
</style>
</head>
<body>
<div id="stage" class="menu">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="tl"></div><div id="tr"></div><div id="bl"></div><div id="br"></div><div id="msg"></div>
  </div>
  <div id="menu">
    <h1>DRIFT<i>.</i></h1>
    <div id="menu-items"></div>
    <canvas id="car-preview" width="720" height="380"></canvas>
    <p id="best"></p>
    <p class="hint hl">CLICK THE GAME FIRST &nbsp;·&nbsp; W S / D-PAD CHOOSE<br>ENTER / SPACE / CROSS TO START</p>
    <p class="hint">GAS R2 / W &nbsp; BRAKE L2 / S &nbsp; STEER STICK / A D<br>HANDBRAKE SQUARE, R1 / SPACE<br>RESET TRIANGLE / R &nbsp; MENU OPTIONS / ESC</p>
    <p id="pad" class="hint"></p>
  </div>
</div>
<script>addEventListener('error',function(e){var p=document.getElementById('pad');if(p)p.textContent='ERROR: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')'})</script>
<script>
// Keyboard + gamepad (PS4 / standard mapping) input
const Input = (() => {
  const K = {}, L = {};
  let kb = 0, gp = null, rt = 0;
  // some embedded previews leave e.code empty, so fall back to e.key
  const code = e => e.code || (e.key === ' ' ? 'Space' : e.key && e.key.length === 1 ? 'Key' + e.key.toUpperCase() : e.key);
  addEventListener('keydown', e => { const c = code(e); K[c] = 1; if (c === 'Space' || (c && c.startsWith('Arrow'))) e.preventDefault(); });
  addEventListener('keyup', e => { K[code(e)] = 0; });
  addEventListener('blur', () => { for (const k in K) K[k] = 0; });
  const dz = v => Math.abs(v) < .14 ? 0 : Math.sign(v) * (Math.abs(v) - .14) / .86;
  const any = (...c) => c.some(k => K[k]);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function poll(dt) {
    gp = null;
    for (const g of (navigator.getGamepads ? navigator.getGamepads() : [])) if (g && g.connected) { gp = g; break; }
    const b = i => gp && gp.buttons[i] ? gp.buttons[i].value : 0;

    // keyboard steering ramps so taps feel gentle and holds feel full (snappier for precision)
    const tgt = (any('KeyD', 'ArrowRight') ? 1 : 0) - (any('KeyA', 'ArrowLeft') ? 1 : 0);
    kb += (tgt - kb) * Math.min(1, dt * (tgt ? 11 : 16));
    let steer = kb;
    if (gp) { const a = clamp(dz(gp.axes[0]) + b(15) - b(14), -1, 1); if (a) steer = a; }

    const ly = gp ? gp.axes[1] : 0;
    const raw = {
      up: any('ArrowUp', 'KeyW') || b(12) > .5 || ly < -.6,
      down: any('ArrowDown', 'KeyS') || b(13) > .5 || ly > .6,
      ok: any('Enter', 'NumpadEnter', 'Space') || b(0) > .5,
      reset: !!K.KeyR || b(3) > .5,
      menu: any('Escape', 'KeyP') || b(9) > .5
    };
    const p = {};
    for (const k in raw) { p[k] = !!raw[k] && !L[k]; L[k] = !!raw[k]; }

    return {
      steer,
      throttle: Math.max(any('KeyW', 'ArrowUp') ? 1 : 0, b(7)),   // R2
      brake: Math.max(any('KeyS', 'ArrowDown') ? 1 : 0, b(6)),    // L2
      hand: (K.Space || b(2) > .5 || b(5) > .5) ? 1 : 0,          // Square / R1
      p
    };
  }

  function rumble(strong, weak) {
    if (!gp || !gp.vibrationActuator) return;
    const t = performance.now();
    if (t - rt < 90) return;
    rt = t;
    try { gp.vibrationActuator.playEffect('dual-rumble', { duration: 100, strongMagnitude: strong, weakMagnitude: weak }); } catch (e) {}
  }

  return { poll, rumble, connected: () => !!gp };
})();
</script>
<script>
// ---------- smooth vector cars ----------
// Local car space: +x = nose, +y = right side, 1 unit ~ 0.285 m. Origin = middle of the car.
const mixc = (h, t, to = 255) => {
  const n = parseInt(h.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(v + (to - v) * t);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
};

// polygon with rounded corners; r is a wish, clamped so neighbouring arcs never collide
function rpoly(c, P) {
  const n = P.length;
  const R = P.map((p, i) => {
    const a = P[(i + n - 1) % n], b = P[(i + 1) % n];
    const ux = a[0] - p[0], uy = a[1] - p[1], vx = b[0] - p[0], vy = b[1] - p[1];
    const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
    if (!lu || !lv || !p[2]) return 0;
    const ang = Math.acos(Math.max(-1, Math.min(1, (ux * vx + uy * vy) / (lu * lv))));
    if (ang > 3.1) return 0;
    return Math.min(p[2], Math.min(lu, lv) / 2 * Math.tan(ang / 2));
  });
  const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const s = m(P[n - 1], P[0]);
  c.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) {
    const p = P[i], e = m(p, P[(i + 1) % n]);
    if (R[i] > 0) c.arcTo(p[0], p[1], e[0], e[1], R[i]); else { c.lineTo(p[0], p[1]); c.lineTo(e[0], e[1]); }
  }
  c.closePath();
}
// half outline (nose centre -> tail centre, y >= 0) -> mirrored Path2D
function sym(half) {
  const top = half.map(p => [p[0], -p[1], p[2]]);
  const bot = half.slice(1, -1).reverse().map(p => [p[0], p[1], p[2]]);
  const path = new Path2D();
  rpoly(path, top.concat(bot));
  return path;
}
// rounded rectangle path from corner coordinates
function rect(c, x0, y0, x1, y1, r) {
  r = Math.min(r, Math.abs(x1 - x0) / 2, Math.abs(y1 - y0) / 2);
  c.moveTo(x0 + r, y0); c.arcTo(x1, y0, x1, y1, r); c.arcTo(x1, y1, x0, y1, r);
  c.arcTo(x0, y1, x0, y0, r); c.arcTo(x0, y0, x1, y0, r); c.closePath();
}
const mirrorRect = (c, x0, ya, x1, yb, r) => { rect(c, x0, ya, x1, yb, r); rect(c, x0, -yb, x1, -ya, r); };

const GLASS = '#121a24', LAMP = '#f3efe2', TAIL = '#a8262c', TAIL_ON = '#ff4044', DARK = '#161c25';

const CAR_SPECS = {
  // ---- Nissan Skyline GT-R (R34): square-shouldered, big wing, four round tail lamps ----
  skyline: {
    full: 'NISSAN SKYLINE GT-R R34', color: '#2f62d6', fx: 4.7, rx: -4.7, hw: 3.15,
    half: [[8.05,0,0],[8.05,2.0,1.2],[7.4,2.95,1.5],[6.0,3.12,1.2],[3.2,3.15,1],[-2.5,3.15,1],[-5.8,3.12,1.2],[-7.5,3.0,1.8],[-8.05,2.2,1.2],[-8.05,0,0]],
    glass: [[2.9,0,0],[2.7,2.35,1.4],[-0.6,2.6,1],[-4.6,2.3,1.4],[-4.9,0,0]],
    roof:  [[1.0,0,0],[0.8,2.4,1.4],[-3.0,2.3,1.4],[-3.3,0,0]],
    detail(c, col, o) {
      c.fillStyle = DARK; c.beginPath(); mirrorRect(c, 4.2, 0.9, 5.4, 1.9, 0.25); c.fill();       // hood vents
      c.fillStyle = LAMP; c.beginPath(); mirrorRect(c, 7.0, 1.3, 7.9, 2.8, 0.45); c.fill();      // headlights
      c.fillStyle = o.brake ? TAIL_ON : TAIL;                                                     // 4 round tail lamps
      for (const y of [-2.4, -1.2, 1.2, 2.4]) { c.beginPath(); c.arc(-7.5, y, 0.52, 0, 7); c.fill(); }
      c.fillStyle = '#10151c'; c.beginPath(); rect(c, -6.9, -2.85, -5.5, 2.85, 0.4); c.fill();    // wing
      c.fillStyle = 'rgba(255,255,255,.14)'; c.beginPath(); rect(c, -6.6, -2.6, -6.3, 2.6, 0.15); c.fill();
    }
  },
  // ---- Toyota Supra (A80): long bonnet, rear-set bubble cabin, huge wing ----
  supra: {
    full: 'TOYOTA SUPRA A80', color: '#f0762a', fx: 4.6, rx: -4.4, hw: 3.18,
    half: [[7.9,0,0],[7.8,1.6,2],[6.9,2.75,2.4],[4.6,3.1,2.2],[1.5,3.18,2],[-2.5,3.18,2.2],[-5.5,3.1,2.6],[-7.2,2.75,2.5],[-7.9,1.8,1.5],[-7.9,0,0]],
    glass: [[1.3,0,0],[1.1,2.2,1.6],[-1.2,2.55,1.2],[-4.0,2.35,2],[-4.4,0,0]],
    roof:  [[-0.1,0,0],[-0.3,2.1,2],[-2.6,2.15,2],[-2.9,0,0]],
    detail(c, col, o) {
      c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 0.22; c.lineCap = 'round';                // bonnet creases
      c.beginPath(); for (const s of [-1, 1]) { c.moveTo(7.2, s * 0.9); c.lineTo(2.3, s * 1.45); } c.stroke();
      c.fillStyle = LAMP; c.beginPath(); mirrorRect(c, 6.5, 1.4, 7.6, 2.6, 0.5); c.fill();
      c.fillStyle = o.brake ? TAIL_ON : TAIL; c.beginPath(); rect(c, -7.95, -2.7, -7.45, 2.7, 0.25); c.fill();
      const wc = mixc(col, 0.4, 0);                                                                // big GT wing
      c.fillStyle = wc; c.beginPath(); rect(c, -7.3, -3.15, -5.8, 3.15, 0.5); c.fill();
      c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); rect(c, -7.0, -2.9, -6.6, 2.9, 0.2); c.fill();
      c.fillStyle = DARK; c.beginPath(); rect(c, -7.3, -3.15, -5.8, -2.8, 0.15); rect(c, -7.3, 2.8, -5.8, 3.15, 0.15); c.fill();
    }
  },
  // ---- Porsche 911: rear-engine teardrop, round lamps on fender humps, fastback ----
  porsche: {
    full: 'PORSCHE 911 CARRERA', color: '#b9c3cf', fx: 4.45, rx: -3.55, hw: 3.05,
    half: [[7.45,0,0],[7.35,1.3,2.5],[6.4,2.4,3],[4.8,2.9,3.5],[2.5,2.98,3],[0,2.9,4],[-3.0,3.05,4],[-5.8,3.1,4],[-7.1,2.5,3],[-7.45,1.5,2],[-7.45,0,0]],
    glass: [[2.6,0,0],[2.4,2.3,1.5],[-0.4,2.55,1.6],[-3.8,2.4,2.2],[-5.4,1.5,1.5],[-5.6,0,0]],
    roof:  [[0.9,0,0],[0.7,2.25,1.5],[-2.6,2.2,2],[-4.6,1.1,1.5],[-4.7,0,0]],
    detail(c, col, o) {
      c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 0.22; c.beginPath();                        // fender / bonnet shape
      rpoly(c, [[7.0,0,0],[6.7,-1.55,2],[3.0,-1.95,2],[2.7,0,0],[3.0,1.95,2],[6.7,1.55,2]]); c.stroke();
      for (const s of [-1, 1]) {                                                                   // round headlamps
        c.fillStyle = '#c9c6b8'; c.beginPath(); c.arc(5.9, s * 2.2, 0.8, 0, 7); c.fill();
        c.fillStyle = LAMP; c.beginPath(); c.arc(5.9, s * 2.2, 0.55, 0, 7); c.fill();
      }
      c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); rect(c, -7.0, -1.5, -5.9, 1.5, 0.4); c.fill(); // engine grille
      c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 0.14; c.beginPath();
      for (let x = -6.8; x < -5.9; x += 0.3) { c.moveTo(x, -1.3); c.lineTo(x, 1.3); } c.stroke();
      c.fillStyle = o.brake ? TAIL_ON : TAIL; c.beginPath(); rect(c, -7.15, -2.5, -6.65, 2.5, 0.25); c.fill();
    }
  },
  // ---- Mazda RX-7 (FD3S): low bubble canopy, pronounced haunches, twin bonnet vents ----
  rx7: {
    full: 'MAZDA RX-7 FD', color: '#d6382f', fx: 4.55, rx: -3.9, hw: 3.08,
    half: [[7.5,0,0],[7.45,1.4,2.5],[6.6,2.5,3.2],[4.6,3.0,3],[2.5,3.08,2.5],[-0.5,2.95,3.5],[-3.5,3.08,3.5],[-5.8,3.08,3.2],[-7.1,2.5,2.8],[-7.5,1.4,2],[-7.5,0,0]],
    glass: [[2.0,0,0],[1.8,2.2,1.6],[-0.5,2.45,1.3],[-3.4,2.3,2],[-4.7,1.4,1.8],[-4.9,0,0]],
    roof:  [[0.5,0,0],[0.3,2.1,1.8],[-2.2,2.15,2],[-3.6,1.2,1.5],[-3.7,0,0]],
    detail(c, col, o) {
      c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); mirrorRect(c, 3.6, 0.55, 5.3, 1.7, 0.4); c.fill();  // twin vents
      c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 0.22; c.beginPath();
      for (const s of [-1, 1]) { c.moveTo(7.0, s * 1.5); c.quadraticCurveTo(4.5, s * 2.1, 2.7, s * 2.1); } c.stroke();
      c.fillStyle = LAMP; c.beginPath(); mirrorRect(c, 6.7, 1.7, 7.35, 2.7, 0.3); c.fill();             // retracted pop-ups
      c.fillStyle = o.brake ? TAIL_ON : TAIL;
      for (const [x, y] of [[-6.9,-1.1],[-6.6,-2.15],[-6.9,1.1],[-6.6,2.15]]) { c.beginPath(); c.arc(x, y, 0.45, 0, 7); c.fill(); }
      c.fillStyle = mixc(col, 0.35, 0); c.beginPath(); rect(c, -6.1, -2.7, -5.0, 2.7, 0.4); c.fill();  // wing
      c.fillStyle = 'rgba(255,255,255,.16)'; c.beginPath(); rect(c, -5.9, -2.5, -5.6, 2.5, 0.12); c.fill();
    }
  },
  // ---- Nissan Silvia (S15): compact three-box coupe, slim lamps, boot lip ----
  silvia: {
    full: 'NISSAN SILVIA S15', color: '#f3c623', fx: 4.5, rx: -4.35, hw: 2.98,
    half: [[7.8,0,0],[7.7,1.5,1.5],[7.0,2.5,2],[5.0,2.9,2],[2.5,2.98,2],[-2,2.98,2],[-5.5,2.95,2.2],[-7.2,2.8,2],[-7.8,2.1,1.2],[-7.8,0,0]],
    glass: [[2.7,0,0],[2.5,2.25,1.4],[-0.3,2.45,1.1],[-4.0,2.2,1.5],[-4.4,0,0]],
    roof:  [[0.9,0,0],[0.7,2.15,1.4],[-2.8,2.1,1.4],[-3.1,0,0]],
    detail(c, col, o) {
      c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 0.2; c.lineCap = 'round';
      c.beginPath(); for (const s of [-1, 1]) { c.moveTo(7.3, s * 0.8); c.lineTo(3.2, s * 1.2); } c.stroke();
      c.fillStyle = LAMP; c.beginPath(); mirrorRect(c, 6.7, 1.2, 7.6, 2.7, 0.4); c.fill();
      c.fillStyle = o.brake ? TAIL_ON : TAIL; c.beginPath(); mirrorRect(c, -7.75, 0.9, -7.2, 2.6, 0.25); c.fill();
      c.fillStyle = mixc(col, 0.3, 0); c.beginPath(); rect(c, -6.9, -2.45, -6.2, 2.45, 0.3); c.fill();
    }
  },
  // ---- Toyota Sprinter Trueno AE86: tiny and boxy, black bonnet "panda", hatch ----
  ae86: {
    full: 'TOYOTA AE86 TRUENO', color: '#eef0f2', fx: 4.4, rx: -4.1, hw: 2.85,
    half: [[7.35,0,0],[7.35,1.7,1.2],[6.8,2.65,1.6],[4.5,2.85,1.5],[2.5,2.85,1.5],[-3,2.85,1.5],[-6.3,2.82,1.6],[-7.35,2.4,1.2],[-7.35,0,0]],
    glass: [[2.8,0,0],[2.6,2.25,1.2],[-0.5,2.5,1],[-4.2,2.3,1.5],[-5.0,1.7,1.5],[-5.2,0,0]],
    roof:  [[1.0,0,0],[0.8,2.25,1.2],[-2.9,2.25,1.3],[-3.9,1.6,1.3],[-4.0,0,0]],
    paint(c, col, body) {
      c.save(); c.clip(body);
      c.fillStyle = '#12161c'; c.beginPath(); rpoly(c, [[7.6,-2.45,0],[7.6,2.45,0],[2.9,2.5,1.2],[2.9,-2.5,1.2]]); c.fill();   // black bonnet
      c.fillStyle = '#12161c'; c.beginPath(); rect(c, -6, 2.5, 5.5, 3.1, 0.2); rect(c, -6, -3.1, 5.5, -2.5, 0.2); c.fill(); // side skirts
      c.restore();
    },
    detail(c, col, o) {
      c.fillStyle = LAMP; c.beginPath(); for (const s of [-1, 1]) { c.arc(6.7, s * 2.0, 0.6, 0, 7); c.closePath(); } c.fill();
      c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 0.15; c.beginPath(); mirrorRect(c, 6.2, 1.5, 7.2, 2.5, 0.3); c.stroke();
      c.fillStyle = o.brake ? TAIL_ON : TAIL; c.beginPath(); mirrorRect(c, -7.3, 1.0, -6.7, 2.6, 0.25); c.fill();
      c.fillStyle = '#12161c'; c.beginPath(); rect(c, -6.5, -2.3, -5.9, 2.3, 0.25); c.fill();
    }
  }
};

// cache Path2Ds and wheel layout once
for (const k in CAR_SPECS) {
  const S = CAR_SPECS[k];
  S.body = sym(S.half); S.glassP = sym(S.glass); S.roofP = sym(S.roof);
}

// Optional sprite override: drop PNGs named skyline/supra/porsche/rx7/silvia/ae86 into a "sprites" folder
// next to this file and they replace the vector bodies. SPRITE_FACING = where the art's nose points
// (0 = right, -Math.PI/2 = up, Math.PI/2 = down). Missing files just fall back to the vector cars.
const SPRITE_DIR = 'sprites/', SPRITE_FACING = -Math.PI / 2, SPRITES = {};
for (const k in CAR_SPECS) {
  const img = new Image();
  img.onload = () => { SPRITES[k] = img; };
  img.src = SPRITE_DIR + k + '.png';
}

// Draws one car. o = { steer (front wheel angle, radians), brake, shadow, lights }
function drawCar(c, S, x, y, a, o = {}) {
  if (o.shadow !== false) {
    c.save(); c.translate(x + 0.9, y + 1.5); c.rotate(a);
    c.fillStyle = 'rgba(0,0,0,.32)'; c.fill(S.body);
    c.restore();
  }
  c.save(); c.translate(x, y); c.rotate(a);
  if (o.lights) {                                   // soft headlight cone
    const g = c.createLinearGradient(7, 0, 46, 0);
    g.addColorStop(0, 'rgba(255,246,220,.16)'); g.addColorStop(1, 'rgba(255,246,220,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(7, -2.2); c.lineTo(46, -11); c.lineTo(46, 11); c.lineTo(7, 2.2); c.closePath(); c.fill();
  }
  if (o.brake) {                                    // brake glow
    const x0 = S.half[S.half.length - 2][0] - 0.8, g = c.createRadialGradient(x0, 0, 0, x0, 0, 6);
    g.addColorStop(0, 'rgba(255,50,50,.22)'); g.addColorStop(1, 'rgba(255,50,50,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x0, 0, 6, 0, 7); c.fill();
  }
  const spr = SPRITES[S.key];
  if (spr) {                                         // sprite mode
    const up = Math.abs(Math.abs(SPRITE_FACING) - Math.PI / 2) < .01, len = S.half[0][0] * 2;
    const sc = len / (up ? spr.height : spr.width);
    c.rotate(-SPRITE_FACING);
    c.drawImage(spr, -spr.width * sc / 2, -spr.height * sc / 2, spr.width * sc, spr.height * sc);
    c.restore();
    return;
  }
  // wheels (front pair steers)
  c.fillStyle = '#0c1015';
  for (const [wx, steer] of [[S.fx, o.steer || 0], [S.rx, 0]]) for (const s of [-1, 1]) {
    c.save(); c.translate(wx, s * (S.hw - 0.5)); c.rotate(steer);
    c.beginPath(); rect(c, -1.1, -0.55, 1.1, 0.55, 0.35); c.fill(); c.restore();
  }
  // body
  c.fillStyle = S.color; c.fill(S.body);
  if (S.paint) S.paint(c, S.color, S.body);
  c.save(); c.clip(S.body); c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 1.1; c.stroke(S.body); c.restore();
  // glasshouse
  c.fillStyle = GLASS; c.fill(S.glassP);
  c.fillStyle = S.roofColor || mixc(S.color, 0.1); if (S.key === 'ae86') c.fillStyle = '#f4f6f8';
  c.fill(S.roofP);
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 0.18; c.stroke(S.glassP);
  S.detail(c, S.color, o);
  c.restore();
}
for (const k in CAR_SPECS) CAR_SPECS[k].key = k;

// closed Catmull-Rom spline
function spline(P, n) {
  const out = [], N = P.length;
  for (let i = 0; i < N; i++) {
    const p0 = P[(i + N - 1) % N], p1 = P[i], p2 = P[(i + 1) % N], p3 = P[(i + 2) % N];
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    }
  }
  return out;
}
// Vector track: everything is drawn live from paths, so it stays razor sharp at any zoom.
const ROAD = '#353e4b', EDGE = '#a3adb9', MARK = 'rgba(255,255,255,.24)';

function buildTrack(P, opts = {}) {
  const W = opts.W || 1400, H = opts.H || 940, HW = opts.HW || 24, SEG = opts.SEG || 24;
  const pts = spline(P, SEG);
  const road = new Path2D();
  pts.forEach((p, i) => i ? road.lineTo(p[0], p[1]) : road.moveTo(p[0], p[1]));
  road.closePath();

  const ground = opts.ground || '#1f2f2b', curbs = opts.curbs || ['#e0474c', '#f2f4f7'];
  let s = opts.seed || 7; const rnd = () => (s = s * 16807 % 2147483647) / 2147483647;

  // big soft tonal patches on the ground
  const patches = [];
  for (let i = 0; i < 34; i++) patches.push({ x: rnd() * W, y: rnd() * H, r: 50 + rnd() * 120, c: i % 2 ? 'rgba(255,255,255,.028)' : 'rgba(0,0,0,.07)' });

  // trees / bushes, kept clear of the road
  const trees = [];
  for (let i = 0; i < (opts.props || 0) * 2 && trees.length < (opts.props || 0); i++) {
    const px = rnd() * W, py = rnd() * H, r = 4.5 + rnd() * 4.5;
    let minD = 1e9;
    for (let k = 0; k < pts.length; k += 3) { const dx = pts[k][0] - px, dy = pts[k][1] - py; minD = Math.min(minD, dx * dx + dy * dy); }
    if (minD > (HW + 14 + r) * (HW + 14 + r)) trees.push({ x: px, y: py, r });
  }

  // drivable mask at 1 unit resolution (curbs count as road)
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const mg = m.getContext('2d', { willReadFrequently: true });
  mg.lineJoin = 'round'; mg.lineWidth = HW * 2 + 8; mg.strokeStyle = '#fff'; mg.stroke(road);
  const d = mg.getImageData(0, 0, W, H).data, mask = new Uint8Array(W * H);
  for (let i = 0; i < mask.length; i++) mask[i] = d[i * 4 + 3] > 127 ? 1 : 0;

  const n = pts.length, a0 = pts[n - 2];
  const line = { x: pts[0][0], y: pts[0][1], a: Math.atan2(pts[1][1] - pts[0][1], pts[1][0] - pts[0][0]) };
  const vis = (v, x, y, m) => x > v.x0 - m && x < v.x1 + m && y > v.y0 - m && y < v.y1 + m;

  return {
    W, H, ground,
    on: (x, y) => { x |= 0; y |= 0; return x >= 0 && y >= 0 && x < W && y < H && mask[y * W + x] === 1; },
    cps: Array.from({ length: P.length }, (_, i) => pts[i * SEG]),
    start: { x: a0[0], y: a0[1], a: Math.atan2(pts[0][1] - a0[1], pts[0][0] - a0[0]) },

    drawGround(c, v) {
      for (const p of patches) if (vis(v, p.x, p.y, p.r)) { c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
      c.lineJoin = 'round'; c.lineCap = 'butt';
      c.setLineDash([]); c.lineWidth = HW * 2 + 8; c.strokeStyle = curbs[0]; c.stroke(road);       // kerbs
      c.setLineDash([9, 9]); c.strokeStyle = curbs[1]; c.stroke(road);
      c.setLineDash([]); c.lineWidth = HW * 2; c.strokeStyle = EDGE; c.stroke(road);              // edge lines
      c.lineWidth = HW * 2 - 2.4; c.strokeStyle = ROAD; c.stroke(road);                           // asphalt
      c.lineWidth = .8; c.strokeStyle = MARK; c.setLineDash([6, 12]); c.stroke(road); c.setLineDash([]);
      if (vis(v, line.x, line.y, HW + 10)) {                                                      // start / finish
        c.save(); c.translate(line.x, line.y); c.rotate(line.a);
        for (let y = -HW + 1.2, r = 0; y < HW - 1.2; y += 3, r++) for (let q = 0; q < 2; q++) {
          c.fillStyle = (r + q) & 1 ? '#12171e' : '#f2f4f7';
          c.fillRect(q * 3 - 3, y, 3, Math.min(3, HW - 1.2 - y));
        }
        c.restore();
      }
    },
    drawProps(c, v) {
      for (const t of trees) {
        if (!vis(v, t.x, t.y, 14)) continue;
        c.fillStyle = 'rgba(0,0,0,.26)'; c.beginPath(); c.arc(t.x + 1.4, t.y + 2.2, t.r, 0, 7); c.fill();
        c.fillStyle = opts.tree1 || '#2d4a3f'; c.beginPath(); c.arc(t.x, t.y, t.r, 0, 7); c.fill();
        c.fillStyle = opts.tree2 || '#3a5d4f'; c.beginPath(); c.arc(t.x - t.r * .18, t.y - t.r * .24, t.r * .62, 0, 7); c.fill();
      }
    }
  };
}

const TRACKS = [

  },

const TRACK_MAP = {};
TRACKS.forEach(t => { TRACK_MAP[t.id] = buildTrack(t.P, t.opts); TRACK_MAP[t.id].meta = t; });

<script>
// Arcade-accurate drift model, run at a fixed 120 Hz step.
// Velocity is split into forward (vl) and sideways (vt) parts. Heading turns from
// steering; the tyres can only remove sideways speed up to a grip limit, so when
// yaw outpaces grip the car slides. Handbrake / throttle lower rear grip.
const BASE_CFG = { ENG: 255, VMAX: 215, BRK: 340, REV: 95, L: 9.5, GRIP: 265 };

class Car {
  constructor() { this.cfg = { ...BASE_CFG }; this.reset(0, 0, 0); }
  setCfg(c) { this.cfg = { ...BASE_CFG, ...c }; }
  reset(x, y, a) { Object.assign(this, { x, y, a, vx: 0, vy: 0, w: 0, slip: 0, on: true }); }
  get speed() { return Math.hypot(this.vx, this.vy); }

  step(i, dt, on) {
    const { ENG, VMAX, BRK, REV, L, GRIP } = this.cfg;
    const c = Math.cos(this.a), s = Math.sin(this.a);
    let vl = this.vx * c + this.vy * s, vt = -this.vx * s + this.vy * c;
    this.on = on; this.slip = Math.abs(vt);

    // longitudinal
    let acc = i.throttle * ENG * (1 - Math.max(vl, 0) / VMAX) * (on ? 1 : .55) - (on ? .22 : 1.15) * vl;
    if (i.brake > .02) acc -= vl > 8 ? BRK * i.brake : REV * i.brake * Math.max(0, 1 + vl / 60);
    if (i.hand) acc -= vl * .55;
    if (vl > 0) acc -= Math.abs(vt) * .45;
    vl += acc * dt;
    if (!i.throttle && !i.brake && Math.abs(vl) < 3) vl = 0;

    // yaw
    const sp = Math.abs(vl), hb = i.hand ? 1 : 0;
    const sa = i.steer * .68 / (1 + sp / 55);
    let wt = vl * Math.tan(sa) / L;
    if (vl > 0) wt += vt * (hb ? .0008 : .0055);
    if (hb) wt *= 1.35;
    wt = Math.max(-5.5, Math.min(5.5, wt));
    this.w += (wt - this.w) * (1 - Math.exp(-dt * (hb ? 9 : 16)));

    // lateral grip
    let G = GRIP * (on ? 1 : .5);
    if (Math.abs(vt) > 28) G *= .72;
    G *= 1 - .42 * i.throttle * Math.min(1, sp / 70);
    if (hb) G *= .18;
    const dv = G * dt;
    vt -= Math.max(-dv, Math.min(dv, vt));

    this.vx = vl * c - vt * s;
    this.vy = vl * s + vt * c;
    this.a += this.w * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
}
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cvEl = $('c'), ctx = cvEl.getContext('2d'), stage = $('stage');
  const H = 1 / 120, ZERO = { steer: 0, throttle: 0, brake: 0, hand: 0 };
  const FREE_GROUND = '#2a3440';

  // canvas always fills the window; the world is scaled so at least 320x180 units are visible
  let dpr = 1;
  const fit = () => {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cvEl.width = Math.max(2, Math.round(innerWidth * dpr));
    cvEl.height = Math.max(2, Math.round(innerHeight * dpr));
  };
  addEventListener('resize', fit); fit();

  // --- Car roster: real-car vector bodies + the same handling numbers as before ---
  const CARS = [
    { id: 'skyline', name: 'SKYLINE', spec: CAR_SPECS.skyline, cfg: { ENG: 260, VMAX: 218, GRIP: 255, L: 9.6 },  stats: 'POWER  •  ANGLE' },
    { id: 'supra',   name: 'SUPRA',   spec: CAR_SPECS.supra,   cfg: { ENG: 280, VMAX: 225, GRIP: 240, L: 10.2 }, stats: 'TORQUE  •  OVERSTEER' },
    { id: 'porsche', name: 'PORSCHE', spec: CAR_SPECS.porsche, cfg: { ENG: 250, VMAX: 220, GRIP: 290, L: 8.8 },  stats: 'GRIP  •  PRECISION' },
    { id: 'rx7',     name: 'RX-7',    spec: CAR_SPECS.rx7,     cfg: { ENG: 245, VMAX: 210, GRIP: 250, L: 8.5 },  stats: 'LIGHT  •  SNAPPY' },
    { id: 'silvia',  name: 'SILVIA',  spec: CAR_SPECS.silvia,  cfg: { ENG: 240, VMAX: 208, GRIP: 260, L: 9.2 },  stats: 'BALANCED  •  FORGIVING' },
    { id: 'ae86',    name: 'AE86',    spec: CAR_SPECS.ae86,    cfg: { ENG: 220, VMAX: 195, GRIP: 245, L: 8.2 },  stats: 'COMPACT  •  PURE' }
  ];

  let carIdx = 0;
  const car = new Car();
  car.setCfg(CARS[0].cfg);
  let SPEC = CARS[0].spec;

  let trackId = TRACKS[0].id;
  let TR = TRACK_MAP[trackId];
  let LAPS = TRACKS[0].laps;

  let best = {};
  try { best = JSON.parse(localStorage.getItem('drift.best')) || {}; } catch (e) {}
  if (best.total && !best.circuit) {
    best.circuit = { total: best.total, lap: best.lap };
    delete best.total; delete best.lap;
  }
  const save = () => { try { localStorage.setItem('drift.best', JSON.stringify(best)); } catch (e) {} };
  const fmt = s => { const m = s / 60 | 0; return m + ':' + (s - m * 60).toFixed(3).padStart(6, '0'); };
  const getBest = id => best[id] || {};

  let menuMode = 'main';
  let mode = 'race', state = 'menu', sel = 0, t = 0, lapT = 0, lap = 1, cp = 1, count = 0, drift = 0, msgT = 0, acc = 0;
  let shake = 0, mult = 1, rankT = 0, rankTxt = '', zoom = 1.3, steerVis = 0, brakeVis = false;
  const cam = { x: 0, y: 0 };

  // tyre marks are stored as line segments (x0,y0,x1,y1) in a ring buffer
  const SK = 9000, sk = new Float32Array(SK * 4);
  let skn = 0, skc = 0;
  const pv = [{ ok: false, x: 0, y: 0 }, { ok: false, x: 0, y: 0 }];
  const parts = [];
  const el = { tl: $('tl'), tr: $('tr'), bl: $('bl'), br: $('br'), msg: $('msg') };
  const menuItemsEl = $('menu-items');
  const preview = $('car-preview'), pctx = preview.getContext('2d');

  const say = (h, s) => { el.msg.innerHTML = h; msgT = s; };

  function selectCar(i) {
    carIdx = i;
    SPEC = CARS[i].spec;
    car.setCfg(CARS[i].cfg);
  }

  function getMenuItems() {
    if (menuMode === 'main') return [
      { label: 'TIME ATTACK', action: () => { menuMode = 'tracks'; sel = 0; } },
      { label: 'FREEPLAY', action: () => start('free') },
      { label: `<i class="dot" style="background:${SPEC.color}"></i>CAR: ${CARS[carIdx].name}`, action: () => { menuMode = 'cars'; sel = carIdx; } }
    ];
    if (menuMode === 'tracks') return TRACKS.map(tr => ({
      label: tr.name,
      action: () => { trackId = tr.id; TR = TRACK_MAP[tr.id]; LAPS = tr.laps; start('race'); }
    })).concat([{ label: '‹ BACK', action: () => { menuMode = 'main'; sel = 0; } }]);
    if (menuMode === 'cars') return CARS.map((c, i) => ({
      label: `<i class="dot" style="background:${c.spec.color}"></i>${c.name}${i === carIdx ? ' ✓' : ''}`,
      action: () => { selectCar(i); menuMode = 'main'; sel = 0; }
    })).concat([{ label: '‹ BACK', action: () => { menuMode = 'main'; sel = 0; } }]);
    return [];
  }

  function start(m) {
    mode = m; skn = skc = 0; pv[0].ok = pv[1].ok = false; parts.length = 0; drift = 0; msgT = 0; acc = 0;
    shake = 0; mult = 1; rankT = 0; rankTxt = ''; steerVis = 0; brakeVis = false;
    if (m === 'race') {
      const s = TR.start;
      car.reset(s.x, s.y, s.a);
      state = 'count'; count = 3.99; t = lapT = 0; lap = 1; cp = 1;
    } else {
      car.reset(0, 0, -Math.PI / 2);
      state = 'play';
    }
    cam.x = car.x; cam.y = car.y;
    stage.className = '';
  }

  function lapDone() {
    const lt = lapT; lapT = 0;
    const b = getBest(trackId);
    let rec = '';
    if (!b.lap || lt < b.lap) { b.lap = lt; rec = 'NEW FASTEST LAP'; }
    best[trackId] = b;
    if (lap >= LAPS) {
      state = 'done';
      const nr = !b.total || t < b.total;
      if (nr) b.total = t;
      best[trackId] = b;
      save();
      say(`FINISH<br><span class="hl">${fmt(t)}</span><small>${nr ? 'NEW RECORD!' : 'BEST ' + fmt(b.total)}<br>R / TRIANGLE RETRY<br>ESC / OPTIONS MENU</small>`, 1e9);
    } else {
      save(); lap++;
      say(`${fmt(lt)}<small>${rec || 'LAP ' + (lap - 1) + ' DONE'}</small>`, 1.8);
    }
  }

  function addSmoke(x, y, vx, vy, life, kind) {
    if (parts.length > 200) return;
    parts.push({ x, y, vx, vy, l: life, l0: life, kind: kind || 0 });
  }

  function sim(inp) {
    const i = state === 'play' ? inp : ZERO;
    const wasOn = car.on;
    car.step(i, H, mode === 'race' ? TR.on(car.x, car.y) : true);
    const sp = car.speed, c = Math.cos(car.a), s = Math.sin(car.a);

    if (state === 'play') {
      t += H; lapT += H;
      if (car.on && car.slip > 28 && sp > 30) {
        const add = (car.slip - 18) * sp / 18 * H * mult;
        drift += add;
        if (car.slip > 40) mult = Math.min(4, mult + H * 0.7);
      } else {
        mult = Math.max(1, mult - H * 1.8);
      }

      if (car.slip > 55 && sp > 50 && rankT <= 0) {
        rankTxt = mult >= 3 ? 'INSANE' : mult >= 2 ? 'GREAT' : 'NICE';
        rankT = 1.1;
      }

      if (mode === 'race') {
        const g = TR.cps[cp % TR.cps.length];
        if (Math.hypot(car.x - g[0], car.y - g[1]) < 52) {
          if (cp === TR.cps.length) { cp = 1; lapDone(); } else cp++;
        }
      }
    }

    const skidding = state !== 'count' && sp > 18 && car.on && (car.slip > 24 || (i.hand && sp > 28));
    if (skidding) {
      const rx = SPEC.rx, off = SPEC.hw - 0.5;
      [-off, off].forEach((ly, w) => {
        const nx = car.x + c * rx - s * ly, ny = car.y + s * rx + c * ly, p = pv[w];
        if (p.ok) { const o = skc * 4; sk[o] = p.x; sk[o + 1] = p.y; sk[o + 2] = nx; sk[o + 3] = ny; skc = (skc + 1) % SK; skn = Math.min(SK, skn + 1); }
        p.x = nx; p.y = ny; p.ok = true;
      });
      const bx = car.x + c * rx, by = car.y + s * rx;
      if (Math.random() < 0.45)
        addSmoke(bx + (Math.random() - .5) * 4, by + (Math.random() - .5) * 4,
                 car.vx * .15 + (Math.random() - .5) * 18, car.vy * .15 + (Math.random() - .5) * 18,
                 0.5 + Math.random() * 0.5, 0);
      if (car.slip > 45 && Math.random() < 0.35)
        addSmoke(bx - c * 1.5, by - s * 1.5, (Math.random() - .5) * 12, (Math.random() - .5) * 12, 0.7, 0);
    } else { pv[0].ok = pv[1].ok = false; }

    if (state !== 'count' && sp > 18) {
      if ((!car.on || (wasOn && !car.on)) && sp > 40) {
        shake = Math.max(shake, 0.35);
        for (let k = 0; k < 2; k++)
          if (Math.random() < .6) addSmoke(car.x + (Math.random() - .5) * 8, car.y + (Math.random() - .5) * 8,
                   (Math.random() - .5) * 30, (Math.random() - .5) * 30, 0.45, 1);
      } else if (car.slip > 60 && Math.random() < 0.2) {
        addSmoke(car.x - c * 3, car.y - s * 3, (Math.random() - .5) * 20, (Math.random() - .5) * 20, 0.2, 2);
      }
    }

    if (car.slip > 50 && sp > 45) shake = Math.max(shake, Math.min(0.55, (car.slip - 40) / 80));
  }

  function drawFreeGround(v) {
    const g = 32;
    for (let gy = Math.floor(v.y0 / g); gy <= v.y1 / g; gy++)
      for (let gx = Math.floor(v.x0 / g); gx <= v.x1 / g; gx++) {
        const X = gx * g, Y = gy * g;
        if (gx % 5 === 0 && gy % 5 === 0) {
          ctx.strokeStyle = 'rgba(255,106,61,.6)'; ctx.lineWidth = .7; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(X - 3, Y); ctx.lineTo(X + 3, Y); ctx.moveTo(X, Y - 3); ctx.lineTo(X, Y + 3); ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.arc(X, Y, .8, 0, 7); ctx.fill();
        }
      }
  }

  function draw() {
    const cw = cvEl.width, ch = cvEl.height;
    let ox = 0, oy = 0;
    if (shake > 0.04) { ox = (Math.random() - .5) * shake * 1.8; oy = (Math.random() - .5) * shake * 1.8; }
    const k = Math.min(cw / 320, ch / 180) * zoom, cx = cam.x + ox, cy = cam.y + oy;
    const v = { x0: cx - cw / 2 / k, y0: cy - ch / 2 / k, x1: cx + cw / 2 / k, y1: cy + ch / 2 / k };

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = mode === 'race' ? TR.ground : FREE_GROUND;
    ctx.fillRect(0, 0, cw, ch);
    ctx.setTransform(k, 0, 0, k, cw / 2 - cx * k, ch / 2 - cy * k);

    if (mode === 'race') TR.drawGround(ctx, v); else drawFreeGround(v);

    // tyre marks (one stroke, so overlaps never get darker)
    if (skn) {
      ctx.lineWidth = 1.05; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(6,8,12,.36)';
      ctx.beginPath();
      for (let i = 0; i < skn; i++) {
        const o = i * 4, x0 = sk[o], y0 = sk[o + 1];
        if (x0 < v.x0 - 4 || x0 > v.x1 + 4 || y0 < v.y0 - 4 || y0 > v.y1 + 4) continue;
        ctx.moveTo(x0, y0); ctx.lineTo(sk[o + 2], sk[o + 3]);
      }
      ctx.stroke();
    }

    if (mode === 'race') TR.drawProps(ctx, v);

    // smoke sits under the car, sparks over it
    for (const p of parts) if (p.kind < 2) {
      const u = Math.max(0, p.l / p.l0);
      if (p.kind === 0) { ctx.globalAlpha = .34 * u * u; ctx.fillStyle = '#e9eef4'; }
      else { ctx.globalAlpha = .3 * u; ctx.fillStyle = '#b9c79a'; }
      ctx.beginPath(); ctx.arc(p.x, p.y, (p.kind ? 1 : 1.5) + (1 - u) * (p.kind ? 3 : 5.5), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const sp = car.speed;
    const steerRad = Math.max(-.6, Math.min(.6, steerVis * .68 / (1 + sp / 55) * 1.5));
    drawCar(ctx, SPEC, car.x, car.y, car.a, { steer: steerRad, brake: brakeVis, lights: true });

    for (const p of parts) if (p.kind === 2) {
      ctx.globalAlpha = Math.min(1, p.l * 5);
      ctx.fillStyle = p.l > .12 ? '#ffb347' : '#ffe9c4';
      ctx.beginPath(); ctx.arc(p.x, p.y, .6, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function hud(dt) {
    const b = getBest(trackId);
    if (mode === 'race') {
      el.tl.innerHTML = `<span class="lbl">${TR.meta.name} · LAP ${lap}/${LAPS}</span><span class="val big">${fmt(t)}</span>`;
      el.tr.innerHTML = `<span class="lbl">BEST</span><span class="val">${b.total ? fmt(b.total) : '--'}</span><span class="lbl">FASTEST LAP</span><span class="val">${b.lap ? fmt(b.lap) : '--'}</span>`;
    } else {
      el.tl.innerHTML = `<span class="lbl">FREEPLAY</span><span class="val big">${CARS[carIdx].name}</span>`;
      el.tr.innerHTML = '<span class="lbl">R / TRIANGLE RESET</span>';
    }
    el.bl.innerHTML = `<span class="val big">${Math.round(car.speed * 1.4)}<span class="unit">KM/H</span></span>`;
    el.br.innerHTML = `<span class="lbl">DRIFT</span><span class="val big hl">${Math.floor(drift)}${mult > 1.15 ? `<span class="mult">×${mult.toFixed(1)}</span>` : ''}</span>`;

    rankT -= dt;
    if (rankT > 0 && state === 'play') {
      el.msg.innerHTML = `<span class="hl">${rankTxt}</span>`;
      el.msg.style.display = 'block';
    } else {
      msgT -= dt;
      el.msg.style.display = msgT > 0 ? 'block' : 'none';
    }
  }

  let lastSig = '';
  function paintPreview() {
    if (menuMode !== 'cars' || sel >= CARS.length) { preview.style.display = 'none'; return; }
    preview.style.display = 'block';
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, preview.width, preview.height);
    const a = performance.now() / 2600;
    pctx.setTransform(22, 0, 0, 22, preview.width / 2, preview.height / 2);
    drawCar(pctx, CARS[sel].spec, 0, 0, a, { steer: 0, shadow: true });
  }

  function paint() {
    const items = getMenuItems();
    const sig = menuMode + '|' + sel + '|' + carIdx + '|' + trackId;
    if (sig !== lastSig) {
      lastSig = sig;
      menuItemsEl.innerHTML = items.map((it, i) => `<div class="item${i === sel ? ' sel' : ''}">${it.label}</div>`).join('');
      menuItemsEl.querySelectorAll('.item').forEach((e, i) => {
        e.onclick = () => { items[i].action(); lastSig = ''; };
        e.onmouseenter = () => { if (sel !== i) { sel = i; } };
      });

      const b = getBest(trackId);
      if (menuMode === 'main') {
        $('best').textContent = b.total ? 'BEST ' + TRACKS.find(t => t.id === trackId).name + ' ' + fmt(b.total) : '';
      } else if (menuMode === 'tracks') {
        const tr = TRACKS[Math.min(sel, TRACKS.length - 1)];
        const bb = tr ? getBest(tr.id) : {};
        $('best').textContent = bb.total ? 'RECORD ' + fmt(bb.total) : (tr ? 'NO RECORD YET' : '');
      } else if (menuMode === 'cars' && sel < CARS.length) {
        $('best').textContent = CARS[sel].spec.full + '  ·  ' + CARS[sel].stats;
      } else {
        $('best').textContent = '';
      }
    }
    $('menu').classList.toggle('sub', menuMode !== 'main');
    paintPreview();
    $('pad').textContent = Input.connected() ? 'CONTROLLER CONNECTED' : 'PRESS A BUTTON TO CONNECT A CONTROLLER';
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const inp = Input.poll(dt), q = inp.p;

    if (state === 'menu') {
      const items = getMenuItems();
      if (q.up) { sel = (sel - 1 + items.length) % items.length; }
      if (q.down) { sel = (sel + 1) % items.length; }
      if (q.ok) { items[sel].action(); lastSig = ''; }
      if (q.menu && menuMode !== 'main') { menuMode = 'main'; sel = 0; }
      paint();
    } else if (q.menu) {
      state = 'menu'; menuMode = 'main'; sel = 0; stage.className = 'menu'; lastSig = '';
    } else if (q.reset || (state === 'done' && q.ok)) {
      start(mode);
    }

    if (state !== 'menu') {
      if (state === 'count') {
        count -= dt;
        if (count <= 0) { state = 'play'; t = lapT = 0; say('GO!', .9); } else say(Math.ceil(count), .2);
      }
      acc += dt;
      while (acc >= H) { sim(inp); acc -= H; }

      if (state === 'play' && car.slip > 30 && car.speed > 35)
        Input.rumble(Math.min(.85, car.slip / 140), .28);

      // visual-only bits: steering wheel smoothing, brake lights, camera follow + speed zoom
      const live = state === 'play';
      steerVis += ((live ? inp.steer : 0) - steerVis) * (1 - Math.exp(-dt * 14));
      brakeVis = live && (inp.brake > .1 || !!inp.hand);
      const k = 1 - Math.exp(-dt * 8);
      cam.x += (car.x - cam.x) * k;
      cam.y += (car.y - cam.y) * k;
      zoom += ((1.32 - .22 * Math.min(1, car.speed / 200)) - zoom) * (1 - Math.exp(-dt * 2));
      shake = Math.max(0, shake - dt * 4);

      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= 0.92; p.vy *= 0.92;
        p.l -= dt;
        if (p.l <= 0) parts.splice(i, 1);
      }
      draw(); hud(dt);
    }
    requestAnimationFrame(frame);
  }
  window.focus();
  addEventListener('pointerdown', () => window.focus());
  paint();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
